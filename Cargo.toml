[package]
name = "chat-llm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chat-llm"
path = "src/main.rs"

[dependencies]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
mem_forget = "warn"

cargo_common_metadata = "allow"
